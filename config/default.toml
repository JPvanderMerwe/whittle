[printers.bambu_a1]
name = "Bambu Lab A1"
bed_mm = [256.0, 256.0, 256.0]
nozzle_mm = 0.40
source = "Bambu Lab published specification - not measured here"

[printers.bambu_a1_mini]
name = "Bambu Lab A1 mini"
bed_mm = [180.0, 180.0, 180.0]
nozzle_mm = 0.40
source = "Bambu Lab published specification - not measured here"

[printers.bambu_p1s]
