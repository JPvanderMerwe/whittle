bed_mm = [220.0, 220.0, 250.0]
nozzle_mm = 0.40
source = "Anycubic published specification - not measured here"


[limits]
# Smallest printable feature, as a multiple of the nozzle width. 1.0 x nozzle
# per the brief. verify/features.py flags anything within 10% as MARGINAL.
min_feature_multiple = 1.0

# Thinnest engraved or embossed line worth cutting.
# Source: MIN_STROKE_MM = 0.45 in reference/rain_loop_keyring.py.
min_engrave_stroke_mm = 0.45

# Thinnest pin or rod section that survives handling.
# Source: two independent reference values agree on this floor -
#   MIN_HANDLE_MM = 2.40      (rain_loop_keyring.py, keyring handle)
#   "Below 2.4 it snaps."     (rain_loop.py, on the pivot spigot)
min_pin_mm = 2.40

# Face-normal overhang limit against the print axis, in degrees from vertical.
max_overhang_deg = 45.0

# Largest fall an underside can have before it needs support. Anything shorter
# is closed by the layer printing above it.
# Source: PIN_GAP_Z = 0.30 mm in reference/vent_louvre.py, a print-in-place
# mechanism that prints with no support at all at 0.20 mm layers. Padded to
# 0.50 so a proven 0.30 gap clears with margin instead of sitting on the line.
max_bridge_gap_mm = 0.50


[export]
# STL export tolerances. These are not taste, they are a bug fix: a finer
# tolerance produced tens of thousands of degenerate facets and a mesh that
# was no longer watertight. Watertightness is re-checked after every export.
# Source: the brief, and reference/rain_loop_keyring.py uses exactly these.
stl_tolerance = 0.005
stl_angular_tolerance = 0.05


# ---------------------------------------------------------------------------
# MODEL LAYER
# ---------------------------------------------------------------------------

[models]
# Hosts permitted in addition to loopback. Empty means loopback only, which is
# the current setting - there is no Tailscale host in play. Adding a host here
# is the ONLY way a non-loopback endpoint can ever be accepted.
allowed_model_hosts = []


# ---------------------------------------------------------------------------
# MATERIALS
# ---------------------------------------------------------------------------
# clearance_mm  total diametral clearance for a running fit in this material
# shrink_pct    linear shrink compensation, percent
#
# WHERE THESE COME FROM - read this before trusting them.
#
# You said you had never needed clearance or shrink numbers, which is exactly
# right for single solid parts: neither matters until two printed parts have to
# fit each other. Rather than invent a table, these are HARVESTED from your own
# reference parts, which printed and worked:
#
#   PIVOT_CLEAR_MM  = 0.30   rain_loop.py, lug bore over the pivot spigot
#   PIN_CLEAR_R     = 0.30   vent_louvre.py, radial, so 0.60 diametral
#   REGISTER_CLEAR  = 0.20   rain_loop.py, cap register socket
#   SCREEN_FIT_MM   = 0.30   rain_loop.py, insert in its pocket
#
# PETG is set to 0.30 mm, the value proven by both a pivot and a print-in-place
# linkage. PLA shrinks and creeps less, so it is given the tighter 0.20 mm from
# the register fit. TPU is UNSET: it is flexible, none of your reference parts
# use it, and a clearance guessed for a flexible material is worse than none.
#
# shrink_pct is 0.0 for PLA and PETG on the evidence that you have never applied
# shrink compensation and your parts came out right. That is a recorded
# observation, not a measurement - if a part ever comes out undersize, measure
# it and put the real number here.
#
# Override any of these the moment you measure better ones.

# RECONSTRUCTION: A PHOTOGRAPH TO A MESH
# ---------------------------------------------------------------------------
# backend  null or triposr. NULL BY DEFAULT, and that is not timidity: a
#          reconstructor is about 2.5 GB of torch and weights, and whittle has to
#          install and run on a machine that has neither. Every part in parts/
#          still rebuilds from its spec.yaml with this off.
#
# device   auto, cpu or cuda. On a 3060 Ti a photograph is a second or two; on
#          a CPU it is minutes. "auto" takes the GPU when there is one and says
#          which it used, so a slow run is never a mystery.
#
# marching_resolution
#          Marching cubes grid for the surface. 256 is the model's own default.
#          128 halves the memory and loses small features - on a part with a
#          5 mm hole in it that is the wrong trade.
#
# WHAT A RECONSTRUCTION IS NOT. It has no scale: a photograph of a bracket and
# a photograph of a bridge are the same pixels, so one real dimension has to
# come from the person holding the object. It is also not printable until
# whittle's own verify pass has said so - neural meshes are routinely
# non-manifold. Both facts are carried in the result rather than left to a UI
# to remember.
[reconstruct]
backend = "null"
device = "auto"
marching_resolution = 256


# ---------------------------------------------------------------------------
# A SENTENCE TO A MESH, for the things no template was written for
# ---------------------------------------------------------------------------
# Every good part whittle makes comes from a template that knows what the
# object IS. That is the product, and it is only as broad as the templates
# somebody has written: ask for a gargoyle and the request falls through to
# composing primitives and comes back as a block.
#
# A text-to-3D model closes that gap the way meshy.ai does - a mesh for any
# prompt - and what comes out is approximate, dimensionless and frequently
# not watertight. whittle then runs its OWN fitters over it, the same ones
# every imported STL goes through, so a generated shape that turns out to be
# turned or extruded becomes an editable spec.
#
# "null" REFUSES AND SAYS WHY, which is the point: silently composing a block
# instead is how somebody ends up with a block and no idea why. Turning it on
# needs an open model, its weights and a GPU - see whittle/imagine.
[imagine]
backend = "null"
device = "auto"

# FILAMENT DENSITY, AND WHY IT IS HERE AT ALL.
#
# A slicer only reports a WEIGHT if its filament profile carries a density.
# PrusaSlicer's stock profile ships with `filament_density = 0`, so a real
# slice of a real hinge came back "total filament used [g] = 0.00" - and a
# screen showing 0 g for a part that plainly weighs something is a figure
# somebody would load a spool against.
#
# THESE ARE PUBLISHED FIGURES, NOT MEASURED ONES. They are the nominal
# densities the filament makers state, and real spools vary with pigment and
# fill - so `density_source` says what kind of number it is, the same way the
# printer catalogue does. Weigh a spool and a known print if you need better,
# and put your own figure here.
#
# g/cm3.
[materials.pla]
clearance_mm = 0.20
shrink_pct = 0.0
density_g_cm3 = 1.24
density_source = "filament makers' published nominal figure - not measured here"

[materials.petg]
clearance_mm = 0.30
shrink_pct = 0.0
density_g_cm3 = 1.27
density_source = "filament makers' published nominal figure - not measured here"

[materials.tpu]
clearance_mm = "UNSET"
shrink_pct = "UNSET"

# ---------------------------------------------------------------------------
# THE REST OF THE SHOP'S STOCK
# ---------------------------------------------------------------------------
# Added 2026-09-14. Source for the LIST is the shop catalogue that prices every
# quote - bit_2_prim/api/seed/catalog.json - which is the single source of
# truth for what Bit Primitive actually keeps on the shelf. Whittle offered
# only pla, petg and tpu, so a customer could not ask it for the ASA part that
# is the shop's own default answer for anything that lives on deck.
#
# THEIR TOLERANCES ARE UNSET AND THAT IS NOT AN OVERSIGHT. The list of
# materials is measured; the clearance and shrink of each one is not. Nobody
# has run a fit test in ASA or in a fibre-filled PETG on this machine, so there
# is no number to write. Rule 29 applies: whittle raises rather than guessing,
# and running_clearance_mm returns None so the moving-parts advice is simply
# left out - exactly as it already is for TPU. A part in one of these prints
# and verifies normally; only running-fit advice is withheld.
#
# TO SET ONE: print a test fit in that material, measure the gap that turns
# freely, and replace the UNSET. One measured number per line, no estimates.
#
# pla_cf is deliberately NOT here. The catalogue records it as not stocked
# locally - a 14-16 working day lead time, which defeats the 48-hour promise -
# and offering a material that cannot be printed this week is worse than not
# offering it.

[materials.pla_silk]
# PLA Silk. High-gloss, cosmetic rather than structural: plaques, nameplates,
# trophies. Same base polymer as PLA, but the additives change how it lays
# down, so PLA's measured 0.20 is NOT assumed to carry over.
clearance_mm = "UNSET"
shrink_pct = "UNSET"

[materials.petg_gf]
# PETG with chopped glass fibre. Stiffer and more dimensionally stable under
# load than plain PETG.
clearance_mm = "UNSET"
shrink_pct = "UNSET"

[materials.petg_cf]
# PETG with carbon fibre. The stiffest material the shop stocks and the most
# dimensionally stable under load.
clearance_mm = "UNSET"
shrink_pct = "UNSET"

[materials.asa]
# ASA. The UV and saltwater material - the one that belongs on deck, and the
# shop's default for anything exterior on a boat in Cape Town.
clearance_mm = "UNSET"
shrink_pct = "UNSET"

[materials.pla_standard]
# Standard PLA. The base polymer and the cheapest on the shelf. PLA's measured
# 0.20 is NOT assumed to carry over: PLA+ is a toughened blend and this is not,
# so its fit behaviour has not been shown to be the same.
clearance_mm = "UNSET"
shrink_pct = "UNSET"

[materials.pla_matte]
# Matte PLA. Matte additives change how it lays down, so the same applies.
clearance_mm = "UNSET"
shrink_pct = "UNSET"


# ---------------------------------------------------------------------------
# MACHINE PROFILES
# ---------------------------------------------------------------------------
# Selected by --machine, an env var, or CUDA auto-detection. Model tags are
# UNSET until the candidates have been benchmarked on the actual hardware -
# see Phase 4. Nothing about a model gets hardcoded before that.

[machines.desktop]
# Home desktop. NVIDIA, 8 GB VRAM (confirmed). The machine for the larger model
# and for batch runs.
backend = "ollama"
host = "http://127.0.0.1:11434"
model_primary = "UNSET"
model_small = "UNSET"
num_ctx = 16384
timeout_s = 120
max_attempts_per_level = 3

[machines.laptop]
# Work laptop, Dell 14 Plus DB14250, Intel Core Ultra 7 258V, 32 GB RAM.
#
# MEASURED 2026-08-27, not assumed. `ollama ps` reports 100% CPU for every
# model: this Ollama build uses neither the Intel iGPU nor the NPU. CPU speed
# is therefore the entire constraint. One schema-constrained generation against
# the real template catalogue (~1700 prompt tokens):
#
#   qwen2.5-coder:7b   120s   102 gen tokens   4 params, all correct
#   gemma4:latest      167s   378 gen tokens   28 params
#   hermes3:latest     309s   417 gen tokens   33 params
#
# qwen is fastest here because it emits only the parameters that matter and
# lets the rest default, which is also the behaviour the prompt asks for. The
# others restate the whole catalogue, which is not wrong but costs 2-3x the
# wall-clock for no extra information.
#
# RE-MEASURED 2026-09-15, AND THE ORDER ABOVE HAS INVERTED. Every generate on
# this machine had begun failing, and the run records said why: the fallback
# "did not answer within 420s". Two runs of each, same prompt, same num_ctx:
#
#   hermes3:latest     133.7s   365 gen tokens   2.7 tok/s   28 params
#   qwen2.5-coder:7b   318.8s   105 gen tokens   0.3 tok/s    5 params
#                      331.0s                                (first run)
#
# THE PROMPT GREW, which is the whole explanation. It was ~1700 tokens in
# August and is 3825 now - the template catalogue gained templates, choices and
# the words that reach them. qwen's generation rate collapses at that context
# and hermes3's does not, so the August conclusion was correct in August and is
# wrong today. Both still parse and both still produce a valid spec.
#
# So the two are swapped. qwen stays as the fallback rather than being dropped:
# it emits a minimal spec, which is the better answer when it arrives, and as
# the second attempt its cost is only paid when the first one failed anyway.
#
# timeout_s is 900. It was 420, set for headroom over a 309s measurement that
# no longer holds - at 3825 tokens the fallback could not finish inside it AT
# ALL, so every escalation ended in a timeout and every failed generate looked
# like a broken engine rather than a slow one. 900 is ~2.7x the slowest run
# measured today.
# WHICH MODEL, MEASURED ON THE REAL PROMPTS RATHER THAN CHOSEN BY SIZE.
#
# Three requests - "Redbull can", "a phone stand", "a bracket for a 35 mm
# pipe" - put through the actual level-2 prompt and the actual validator, on
# 2026-09-22:
#
#   gemma4:latest      3 of 3 valid   238 - 306 s
#   hermes3:latest     1 of 3 valid   332 - 809 s   (3 of 3 once the
#                                                    unknown-field repair
#                                                    is applied)
#   qwen2.5-coder:7b   1 of 3 valid   229 - 366 s
#
# gemma4 is BOTH more accurate and faster here, which is the opposite of what
# its size suggests - 10 GB against 4.7 GB on a CPU-only machine. Measured,
# not reasoned about, and that is why the figures are written down: the next
# person to look at this will assume the big model is the slow one too.
#
# hermes3 stays as the fallback. It is the one that was proven over months of
# this project, its failures are now mostly repaired deterministically, and a
# second model that fails differently is worth more than a second copy of the
# first.
backend = "ollama"
host = "http://127.0.0.1:11434"
model_primary = "gemma4:latest"
model_small = "hermes3:latest"
num_ctx = 8192
timeout_s = 900
max_attempts_per_level = 2
