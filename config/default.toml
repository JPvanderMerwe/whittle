# whittle default configuration
# ---------------------------
# Every value here is either MEASURED, taken from the brief, or marked "UNSET".
# Nothing is estimated. A value marked "UNSET" has no source yet, and whittle
# refuses to use it rather than substituting a plausible-looking number - a
# wrong tolerance is worse than no tolerance.
#
# Run `whittle config show` to see the resolved values and everything still unset.


[print]
# Source: NOZZLE_MM = 0.40 in reference/rain_loop_keyring.py, and the print
# notes of every reference part.
nozzle_mm = 0.40

# Source: the print notes in the louvre vent reference. Note the reference
# parts each pick their own: keyring 0.12 (its face detail is in Z), the
# six-part assembly 0.16, the vent 0.20. This is the general default and a
# spec may override it per part.
layer_mm = 0.20


[printer]
# THE MACHINE. Stated by the owner on 2026-08-31. Do not change these without
# being told to - they are not a default and they are not a guess.
name = "Creality i7"
multi_colour = true

[bed]
# The usable build volume, in mm, of the printer above. A part is checked
# against this IN ITS PRINT ORIENTATION, because that is the shape that has to
# fit - a two-piece part laid out side by side is wider than either piece.
#
# Nothing checked this until a refinement asked for "a more complex birdhouse"
# and produced a 1248 x 590 x 600 mm layout - 18 kg of filament - and every
# other check passed it, because it was a perfectly manufacturable object that
# simply would not fit on any printer in the building.
#
# MEASURED FROM THE MACHINE, not assumed. Note the height is 255 and not 260 -
# it is not a cube, and rounding it up would let a 258 mm part through.
width_mm = 260.0
depth_mm = 260.0
height_mm = 255.0

# ---------------------------------------------------------------------------
# OTHER PRINTERS SOMEBODY MIGHT HAVE
# ---------------------------------------------------------------------------
# WHY A CATALOGUE AT ALL. Everything this engine checks is checked against a
# real machine - a part is measured against a bed it has to fit, a nozzle that
# decides the thinnest wall, a layer height that decides what a chamfer looks
# like. That machine was one machine, named above, because it is the one in
# the building. Anybody else running whittle was being told their part fits a
# bed they do not own.
#
# EVERY FIGURE HERE CARRIES WHERE IT CAME FROM, and none of them came from
# this workshop. The entry above is measured - somebody put a tape on it, and
# the note says the height is 255 rather than 260 for exactly that reason.
# These are the manufacturers' published specifications, which is a real
# source and a weaker one: a published build volume is a maximum, it ignores
# clips and cable chains, and machines vary. So each says so, and `source`
# travels with the numbers into anything that reads them.
#
# CONFIRM YOURS BEFORE TRUSTING IT. Picking a printer here is better than
# being checked against somebody else's, and measuring your own is better
# than both - which is what `[bed]` above is for.
#
# The nozzle is what the machine ships with. Anybody who has changed theirs
# knows they have, and the app lets it be set per part.

[printers.creality_i7]
name = "Creality Sparkx i7"
bed_mm = [260.0, 260.0, 255.0]
nozzle_mm = 0.40
source = "measured on the machine in this workshop, 2026-08-31"

[printers.ender_3]
name = "Creality Ender 3 / 3 Pro / 3 V2"
bed_mm = [220.0, 220.0, 250.0]
nozzle_mm = 0.40
source = "Creality published specification - not measured here"

[printers.ender_3_s1]
name = "Creality Ender 3 S1 / S1 Pro"
bed_mm = [220.0, 220.0, 270.0]
nozzle_mm = 0.40
source = "Creality published specification - not measured here"

[printers.ender_5]
name = "Creality Ender 5 / 5 Pro"
bed_mm = [220.0, 220.0, 300.0]
nozzle_mm = 0.40
source = "Creality published specification - not measured here"

[printers.cr_10]
name = "Creality CR-10"
bed_mm = [300.0, 300.0, 400.0]
nozzle_mm = 0.40
source = "Creality published specification - not measured here"

[printers.k1]
name = "Creality K1"
bed_mm = [220.0, 220.0, 250.0]
nozzle_mm = 0.40
source = "Creality published specification - not measured here"

[printers.k1_max]
name = "Creality K1 Max"
bed_mm = [300.0, 300.0, 300.0]
nozzle_mm = 0.40
source = "Creality published specification - not measured here"

[printers.prusa_mk4]
name = "Prusa MK4 / MK3S+"
